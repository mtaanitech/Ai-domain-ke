<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MtaaniHost - REAL Checker + Live Tail</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c18;color:#e2e8f0;font-family:system-ui;padding:16px}
.header{max-width:600px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
.live{width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.card{max-width:600px;margin:0 auto 16px;background:#121a33;border:1px solid #1e2a50;padding:18px;border-radius:16px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #24325f;background:#0f1730;color:#fff;font-size:15px;margin:8px 0}
button{width:100%;padding:14px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer}
.btn-blue{background:#3b82f6;color:#fff}
.btn-green{background:#22c55e;color:#000;margin-top:8px}
.result{margin-top:12px;padding:14px;border-radius:10px;font-size:14px}
.ok{background:#052e14;border:1px solid #16a34a;color:#4ade80}
.taken{background:#2e0e0e;border:1px solid #dc2626;color:#fca5a5}
.tail-wrap{max-width:600px;margin:0 auto;background:#000;border-radius:12px;overflow:hidden;border:1px solid #1e293b}
.tail-head{padding:10px 14px;background:#0f172a;font-size:12px;display:flex;justify-content:space-between}
#tail{height:220px;overflow-y:auto;padding:10px;font-family:monospace;font-size:11px;line-height:1.6}
.log-success{color:#22c55e}.log-error{color:#ef4444}.log-check{color:#60a5fa}.log-clone{color:#a78bfa}.log-info{color:#94a3b8}
.badge{font-size:10px;padding:3px 6px;border-radius:4px;background:#1e293b}
</style>
</head>
<body>

<div class="header">
<h2 style="margin:0">🌍 MtaaniHost REAL</h2>
<span><span class="live"></span> LIVE TAIL</span>
</div>

<div class="card">
<h3 style="margin:0 0 6px">Check Domain Worldwide (REAL WHOIS)</h3>
<p style="margin:0;opacity:.6;font-size:13px">Uses RDAP.org - Free - Works for .com .co.ke .app .store</p>
<input id="domain" placeholder="e.g. google.com or mtaani.com">
<button class="btn-blue" onclick="checkDomain()">CHECK REAL WHOIS</button>
<div id="result"></div>
</div>

<div class="card">
<h3 style="margin:0 0 6px">Clone GitHub & Suggest Domains</h3>
<input id="repo" placeholder="https://github.com/user/repo">
<button class="btn-green" onclick="cloneRepo()">CLONE + GENERATE DOMAINS</button>
<div id="cloneResult"></div>
</div>

<div class="tail-wrap">
<div class="tail-head"><span>● background logs — live tail</span><span class="badge" id="logCount">0 logs</span></div>
<div id="tail">Waiting for activity...</div>
</div>

<script>
async function checkDomain(){
  const d=document.getElementById('domain').value.trim();
  if(!d) return alert('Enter domain e.g. mtaani.com');
  document.getElementById('result').innerHTML='⏳ Checking REAL WHOIS worldwide via RDAP.org...';
  try{
    const r=await fetch('/api/check?domain='+encodeURIComponent(d));
    const j=await r.json();
    if(j.available){
      document.getElementById('result').innerHTML=`<div class="result ok"><b>${j.domain} — AVAILABLE ✅</b><br>REAL: No one owns it in the world.<br><br><button class="btn-green" onclick="buy('${j.domain}')">BUY NOW KES 1500</button></div>`;
    }else{
      document.getElementById('result').innerHTML=`<div class="result taken"><b>${j.domain} — TAKEN ❌</b><br>REAL: Someone already owns it worldwide.</div>`;
    }
  }catch(e){
    document.getElementById('result').innerHTML=`<div class="result taken">Error: ${e.message}</div>`;
  }
}

async function cloneRepo(){
  const repoUrl=document.getElementById('repo').value.trim();
  if(!repoUrl) return alert('Paste github link');
  document.getElementById('cloneResult').innerHTML='⏳ Cloning in background... watch live tail below';
  const r=await fetch('/api/clone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repoUrl})});
  const j=await r.json();
  if(j.ok){
    document.getElementById('cloneResult').innerHTML=`<div class="result ok"><b>Cloned ${j.cloned.user}/${j.cloned.repo}</b> ⭐ ${j.cloned.stars}<br>${j.cloned.description||''}<br><br>${j.suggested_domains.map(d=>`<div style="display:flex;justify-content:space-between;background:#0f1730;padding:6px 8px;border-radius:6px;margin:4px 0"><span>${d}</span><button onclick="document.getElementById('domain').value='${d}';checkDomain()" style="width:auto;padding:4px 10px;font-size:12px">check</button></div>`).join('')}</div>`;
  }else{
    document.getElementById('cloneResult').innerHTML=`<div class="result taken">${j.error}</div>`;
  }
}

function buy(d){ alert('Order for '+d+' - Customer pays you first via M-Pesa, then you buy on Cloudflare'); }

// LIVE TAIL - auto scroll
async function refreshTail(){
  try{
    const r=await fetch('/api/logs');
    const j=await r.json();
    const el=document.getElementById('tail');
    el.innerHTML=j.logs.slice(-40).map(l=>`<div class="log-${l.type||'info'}">[${l.t||''} ${l.time||''}] ${l.msg}</div>`).join('');
    el.scrollTop=el.scrollHeight;
    document.getElementById('logCount').innerText=j.logs.length+' logs';
  }catch{}
}
setInterval(refreshTail,1000);
refreshTail();
</script>
</body>
</html>
